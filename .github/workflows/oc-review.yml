name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dead-code report (requires inspection)
        run: bun run dead-code

      - name: Oxlint report (requires authored-finding review)
        shell: bash
        run: |
          # Checkout is the PR merge: its first parent is the tested base.
          git rev-parse --verify HEAD^2
          base=$(git rev-parse HEAD^1)
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- \
            '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' > "$RUNNER_TEMP/oxlint-paths"
          mapfile -d '' -t files < "$RUNNER_TEMP/oxlint-paths"
          if ((${#files[@]})); then
            node scripts/anti-slop.mjs file --include-noisy -- "${files[@]}"
          else
            echo 'No changed JavaScript or TypeScript files.'
          fi

      - name: Verify branding outputs and ownership
        run: bun run brand:check && bun run test:brand

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Changelog outputs match their sources
        run: bun run changelog:check

      - name: Tests
        run: bun run test

      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater
          bun run type-check
