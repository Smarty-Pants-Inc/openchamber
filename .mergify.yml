merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

# smarty-dev's plain rule for main (smarty-dev#865): the PR, its required checks and this queue
# are the review. The Astra reviewer queues a ready PR after its success verdict; `hold` and
# DO NOT LAND titles keep a PR out.
queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      - check-success = smarty-ci
      - -check-failure = smarty-ci
    merge_conditions:
      - check-success = smarty-ci
      - -check-failure = smarty-ci

  - name: smarty-code
    batch_size: 1
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = smarty-code
      - -draft
      - check-success = checks
      - check-success = review/astra
    merge_conditions:
      - check-success = checks

# GitHub suspended smarty-agents (2026-09-25); the review agent queues as the write App's bot,
# which has no collaborator permission (smarty-dev#735). Humans with write access still can.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
  # smarty-land's emergency dequeue posts as the actor that queued, the write App bot (smarty-dev#1513).
  dequeue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
  # The stuck-work check posts one `@mergifyio refresh` per stale head as the write App bot (smarty-dev#868,
  # #1513); without this Mergify answers "Command disallowed".
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
