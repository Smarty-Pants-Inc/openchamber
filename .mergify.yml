merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

# smarty-dev's plain rule for main (smarty-dev#865): the PR, its required checks and this queue
# are the review. The Astra reviewer queues a ready PR after its success verdict; `hold` and
# DO NOT LAND titles keep a PR out.
queue_rules:
  - name: default
    batch_size: 4
    batch_max_wait_time: 2 min
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      # A PR labelled needs-security-pass waits for the named security pass (smarty-dev#2630;
      # openchamber#454 merged without one on 2026-10-01).
      - or:
          - -label = needs-security-pass
          - check-success = review/security
      - check-success = smarty-ci
      - -check-failure = smarty-ci
    merge_conditions:
      - check-success = smarty-ci
      - -check-failure = smarty-ci

  - name: smarty-code
    batch_size: 4
    batch_max_wait_time: 2 min
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = smarty-code
      - -draft
      - check-success = checks
      - check-success = review/astra
      # A PR labelled needs-security-pass waits for the named security pass (smarty-dev#2630;
      # openchamber#454 merged without one on 2026-10-01).
      - or:
          - -label = needs-security-pass
          - check-success = review/security
    merge_conditions:
      - check-success = checks

# GitHub suspended smarty-agents (2026-09-25); the review agent queues as the write App's bot,
# which has no collaborator permission (smarty-dev#735). Humans with write access still can.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]
  # The stuck-work check's R4 posts one `@mergifyio refresh` per head as the write App (smarty-dev#868);
  # without this Mergify answers "Command disallowed" (smarty-dev#251 F277/F279/F284, 2026-09-28).
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]

# Sanctioned front-of-queue route, as smarty-dev (#2004 T10; org for Paul 2026-10-02): a PR labelled p0 is
# checked ahead of the rest of the queue.
priority_rules:
  - name: p0
    conditions:
      - label = p0
    priority: high
    # Priority must not discard in-flight CI (smarty-dev decision #2143, proven #2356).
    allow_checks_interruption: false
