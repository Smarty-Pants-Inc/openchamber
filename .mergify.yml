merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - check-success = smarty-review
      - check-success = smarty-land-ready
      - check-success = smarty-ci
      - check-success = review/astra
    merge_conditions:
      - check-success = smarty-ci

  - name: smarty-code
    batch_size: 1
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = smarty-code
      - -draft
      - check-success = checks
      - check-success = review/astra
    merge_conditions:
      - check-success = checks
